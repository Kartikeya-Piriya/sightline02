<script type="module">
import * as THREE from 'three';

const { useState, useRef, useEffect, useCallback } = React;
const html = htm.bind(React.createElement);
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
// DEMO ONLY: SHA-256 of the demo PIN "2580". In production, verify against your backend, never in client code.
const PIN_HASH = 'ed946f65d2c785d90e827c5ffd879ce3b49c68d4c88013074176a7e73bc58bcf';
const DWELL = .45;                        // seconds a fingertip must stay on a key to register a press
const S = { fps: 0, hands: 0, faces: 0, threat: false, inject: false, delegate: 'GPU' };   // telemetry engine -> React
const add = THREE.AdditiveBlending;
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');

/* ---------- Three.js stage: holographic keypad, fingertip cursor, threat guard ---------- */
function createStage(el, cb, log) {

    const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s, ox = (W - dw) / 2, oy = (H - dh) / 2;
    const wx = nx => ox + (1 - nx) * dw - W / 2, wy = ny => H / 2 - oy - ny * dh;   // mirrored like the selfie video

    const id = pad.visible && tip ? pick(tip.x, tip.y) : null;

      const on = kk.id === hov.id, pr = !on ? 0 : live ? Math.min(hov.t / DWELL, 1) : 1, hit = on && (hov.fired || now - flash < 220);

        const fs = await FilesetResolver.forVisionTasks(MP + '/wasm');

        };

/* ---------- React dashboard ---------- */
function App() {

    </div>`}

    ${auth && !threat.on && html`<div class="absolute inset-0 z-30 grid place-items-center p-4 pointer-events-none">
      <div class="glass w-full max-w-xs border-emerald-400/50 p-5 text-center">
        <div class="disp text-xl font-bold text-emerald-300">Session unlocked</div>
        <p class="mt-1 text-xs text-cyan-100/70">The keypad is hidden while you're signed in.</p>
        <button class="btn mt-4 w-full" onClick=${lock}>Lock session</button>
      </div></div>`}

    ${threat.on && html`<div class="pointer-events-none absolute inset-0 z-40 grid place-items-center p-4">
      <div role="alert" class="alert pointer-events-auto w-full max-w-lg rounded-2xl border border-amber-400 bg-black/60 p-6 text-center">
        <p class="disp text-lg font-bold leading-snug text-amber-300">⚠️ CRITICAL ALERT: Shoulder-Surfing Threat Intercepted. Authentication canvas suspended to maintain session integrity.</p>
        <p class="mt-3 text-xs text-amber-100/70">${threat.why}. The camera feed is blurred and all input is blocked.</p>
        <button class="btn amber mt-5" disabled=${st.threat} onClick=${resume}>${st.threat ? 'Threat still in frame…' : 'Resume authentication'}</button>
      </div></div>`}

    ${mode === 'nogl' && html`<div class="absolute inset-0 z-40 grid place-items-center p-4"><div class="glass max-w-sm p-5 text-sm text-amber-300">WebGL isn't available on this device, so the holographic keypad can't start. Try a current version of Chrome, Edge, or Safari with hardware acceleration on.</div></div>`}

    ${mode === 'boot' && html`
      <div class="absolute inset-0 z-50 grid place-items-center bg-black/45 p-4 backdrop-blur-sm">
        <div class="glass w-full max-w-md p-6">
          <h1 class="disp text-3xl font-bold tracking-wide text-cyan-300">Spatial Guard</h1>
          <p class="mt-3 text-xs leading-relaxed text-cyan-100/70">Enter a PIN on a floating 3D keypad by holding your index fingertip over each key. If a second hand or another face enters the frame, the camera feed blurs and input locks. Video is processed on this device and never uploaded.</p>
          <p class="mt-3 text-xs text-cyan-100/70">Demo PIN: <span class="text-cyan-300">2580</span></p>
          <div class="mt-5 flex flex-col gap-2">
            <button class="btn" disabled=${busy} onClick=${() => go(true)}>${busy ? 'Calibrating…' : '⚡ Start spatial guard'}</button>
            <button class="btn" disabled=${busy} onClick=${() => go(false)}>Use pointer mode (no camera)</button>
          </div>
        </div>
      </div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
